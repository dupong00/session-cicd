# Phase 2 - Redis 구성: 앱 2대 + nginx + redis
# 세션을 각 앱 메모리가 아니라 공유 Redis에 저장 → 어느 앱으로 가도 로그인 유지.

services:
  redis:
    image: redis:7-alpine

  app-1:
    build: .
    environment:
      - INSTANCE_ID=app-1
      - REDIS_HOST=redis
    expose:
      - "8080"
    depends_on:
      - redis

    healthcheck:
      test: ["CMD", "bash", "-c", ": > /dev/tcp/127.0.0.1/8080"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 15s

  # 앱 인스턴스 2
  app-2:
    build: .
    environment:
      - INSTANCE_ID=app-2
      - REDIS_HOST=redis
    expose:
      - "8080"
    depends_on:
      - redis
    healthcheck:
      test: ["CMD", "bash", "-c", ": > /dev/tcp/127.0.0.1/8080"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 15s

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app-1:
        condition: service_healthy
      app-2:
        condition: service_healthy

services:
  redis-master:
    image: redis:7-alpine
    command: ["redis-server", "/etc/redis/redis.conf"]
    volumes:
      - ./redis-master.conf:/etc/redis/redis.conf:ro

  redis-replica-1:
    image: redis:7-alpine
    command: ["redis-server", "/etc/redis/redis.conf"]
    volumes:
      - ./redis-replica.conf:/etc/redis/redis.conf:ro
    depends_on:
      - redis-master

  redis-replica-2:
    profiles: ["r2", "r3"]
    image: redis:7-alpine
    command: ["redis-server", "/etc/redis/redis.conf"]
    volumes:
      - ./redis-replica.conf:/etc/redis/redis.conf:ro
    depends_on:
      - redis-master

  redis-replica-3:
    profiles: ["r3"]
    image: redis:7-alpine
    command: ["redis-server", "/etc/redis/redis.conf"]
    volumes:
      - ./redis-replica.conf:/etc/redis/redis.conf:ro
    depends_on:
      - redis-master

  sentinel-1:
    image: redis:7-alpine
    entrypoint: ["sh", "/entrypoint.sh"]
    volumes:
      - ./redis-sentinel.conf:/etc/redis/sentinel.conf:ro
      - ./sentinel-entrypoint.sh:/entrypoint.sh:ro
    depends_on:
      - redis-master

  sentinel-2:
    image: redis:7-alpine
    entrypoint: ["sh", "/entrypoint.sh"]
    volumes:
      - ./redis-sentinel.conf:/etc/redis/sentinel.conf:ro
      - ./sentinel-entrypoint.sh:/entrypoint.sh:ro
    depends_on:
      - redis-master

  sentinel-3:
    image: redis:7-alpine
    entrypoint: ["sh", "/entrypoint.sh"]
    volumes:
      - ./redis-sentinel.conf:/etc/redis/sentinel.conf:ro
      - ./sentinel-entrypoint.sh:/entrypoint.sh:ro
    depends_on:
      - redis-master

  app-1:
    build: ..
    environment:
      - INSTANCE_ID=app-1
      - SPRING_PROFILES_ACTIVE=sentinel
    expose:
      - "8080"
    depends_on:
      - sentinel-1
      - sentinel-2
      - sentinel-3
    healthcheck:
      test: ["CMD", "bash", "-c", ": > /dev/tcp/127.0.0.1/8080"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 15s

  app-2:
    build: ..
    environment:
      - INSTANCE_ID=app-2
      - SPRING_PROFILES_ACTIVE=sentinel
    expose:
      - "8080"
    depends_on:
      - sentinel-1
      - sentinel-2
      - sentinel-3
    healthcheck:
      test: ["CMD", "bash", "-c", ": > /dev/tcp/127.0.0.1/8080"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 15s
  
  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ../nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app-1:
        condition: service_healthy
      app-2:
        condition: service_healthy